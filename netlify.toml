[build]
  publish = "dist"
  command = "npm run build"

[dev]
  command = "node server/server.js"
  targetPort = 5000
  port = 8888
  framework = "vite"

[[redirects]]
  from = "/api/*"
  to = "http://localhost:5000/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200